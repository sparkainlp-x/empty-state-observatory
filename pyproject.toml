[build-system]
requires = ["setuptools==83.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "empty-state-observatory"
version = "0.1.0"
description = "Synthetic paired-run game and reproducible 32-channel consistency-monitor benchmark"
readme = "README.md"
requires-python = "==3.12.3"
license = { file = "LICENSE" }
authors = [{ name = "Spark" }]
keywords = ["synthetic-data", "simulation", "reproducibility", "telemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
empty-state-observatory = "empty_state_observatory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
